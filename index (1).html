@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141c;--card:#17212c;--tx:#e8eef4;--mut:#93a3b3;--ac:#ff8a3d;--bd:#26364a;--hd:#1e2c3b;--sh:none}}
:root[data-theme="dark"]{--bg:#0d141c;--card:#17212c;--tx:#e8eef4;--mut:#93a3b3;--ac:#ff8a3d;--bd:#26364a;--hd:#1e2c3b;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{margin:10px 12px 0;padding:18px 16px;border-radius:18px;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;display:flex;align-items:center;gap:14px;box-shadow:0 6px 18px rgba(11,34,57,.25);position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(var(--ac),transparent 70%);opacity:.35}
.lg{flex:none;width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;border:1px solid rgba(255,255,255,.25)}
h1{margin:0;font-size:23px;letter-spacing:.5px;font-weight:800}
h1 span{color:var(--ac2)}
header p{margin:2px 0 0;color:#c4d6e8;font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 15px;border-radius:22px;font:inherit;font-size:14px;font-weight:600;box-shadow:var(--sh)}
nav button.on{background:linear-gradient(135deg,var(--ac),#ff9a4d);border-color:transparent;color:#fff}
main{padding:2px 12px 32px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.res div{background:var(--hd);border-radius:12px;padding:10px 12px;border-left:3px solid var(--ac)}
.res b{display:block;font-size:19px;color:var(--tx);margin-top:2px;word-break:break-word}
.res span{font-size:12px;color:var(--mut)}
.tw{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left}
th{background:var(--hd);position:sticky;top:0;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.ub{padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-weight:600}
.ub.on{background:var(--ac);border-color:var(--ac);color:#fff}
footer{text-align:center;color:var(--mut);font-size:12px;padding:0 12px 18px}
</style>
</head>

wt:{n:'Poids & camion',h:()=>`<div class="card"><label>Outil</label><select id="a">${opts(WT)}</select><div class="row">${inp('l','Longueur totale (m)',28)}${inp('d','Densité boue (s.g)',1.09)}</div><div class="row">${inp('j','Longueur tube (m)',9.2)}${inp('k','Charge camion (t)',30)}</div><div id="o"></div><button class="ub on" id="ad" style="width:100%;margin-top:12px">➕ Ajouter à la liste (longueur ci-dessus)</button></div><div class="card"><b>Liste des tubes (cumul)</b><div id="ls"></div>${inp('tp','Poids supplémentaires (t), ex. Top Drive – sans flottabilité',0)}<div id="tt"></div><button class="ub" id="cl" style="width:100%;margin-top:10px">Vider la liste</button></div><div class="card"><p class="note">Facteur de flottabilité = 1 − densité boue ÷ 7,85 · DC 3 1/8 : le fichier d’origine indiquait 11,4 kg/m (erreur), remplacé par 32,63 kg/m (feuille couple, cohérent avec le volume d’acier 4,15 L/m) · DC 6½ corrigé de 161,1 à 147,92 et DC 4¾ de 68,6 à 69,61 kg/m, conformément aux tables Drilling Tools (99,5 et 46,8 lb/ft)</p></div>`,
 i:()=>{const u=()=>{const w=+WT[$('#a').value][1],L=+$('#l').value,b=1-$('#d').value/7.85,pj=w*$('#j').value/1000;$('#o').innerHTML=res([['Poids total (t)',f(w*L/1000,3)],['Poids immergé (t)',f(w*L/1000*b,3)],['Facteur de flottabilité',f(b,4)],['Poids d’un tube (t)',f(pj,3)],['Tubes par camion',Math.floor($('#k').value/pj)||'–'],['Camions pour la longueur',f(L/$('#j').value/(Math.floor($('#k').value/pj)||1),2)]])};window.WL=window.WL||[];const rl=()=>{const b=1-$('#d').value/7.85,tp=+$('#tp').value||0;let L=0,W=0;WL.forEach(x=>{L+=x.L;W+=x.w*x.L/1000});$('#ls').innerHTML=WL.length?tbl(['Outil','Long. m','Poids t','Immergé','✕'],WL.map((x,k)=>`<tr><td>${x.n}</td><td>${f(x.L,2)}</td><td>${f(x.w*x.L/1000,3)}</td><td>${f(x.w*x.L/1000*b,3)}</td><td><button class="ub" data-k="${k}">✕</button></td></tr>`).join('')):'<p class="note">Liste vide – choisissez un outil et une longueur puis cliquez sur Ajouter</p>';$('#tt').innerHTML=res([['Longueur totale (m)',f(L,2)],['Poids total (t)',f(W+tp,3)],['Poids immergé (t)',f(W*b+tp,3)],['Facteur de flottabilité',f(b,4)]])};$('#ad').onclick=()=>{const r=WT[$('#a').value];WL.push({n:r[0],w:+r[1],L:+$('#l').value});rl()};$('#cl').onclick=()=>{WL.length=0;rl()};$('#ls').onclick=e=>{const k=e.target.dataset.k;if(k!==undefined){WL.splice(+k,1);rl()}};$('#tp').oninput=rl;['#a','#l','#d','#j','#k'].forEach(s=>$(s).oninput=()=>{u();rl()});u();rl()}},
cv:{n:'Conversions',h:()=>`<div class="card"><label>Conversion</label><select id="a">${opts(CV)}</select>${inp('v','Valeur',1)}<label><input type="checkbox" id="r" style="width:auto"> Sens inverse</label><div id="o"></div></div>`,
 i:()=>{const u=()=>{const c=CV[$('#a').value],v=+$('#v').value,[x,y]=c[0].split(' → '),rv=$('#r').checked;$('#o').innerHTML=res([[rv?y+' → '+x:c[0],f(rv?v/c[1]:v*c[1],5)],['Facteur',c[1]]])};['#a','#v','#r'].forEach(s=>$(s).oninput=u);u()}},
fl:{n:'Brides',h:()=>`<div class="card">${search('q','Rechercher (ex. BX158 ou 11")…')}${tbl(['Bride','N','Boulon in','Goujon DSA in','Goujon DFA in'],'','tb')}<p class="note">DSA : goujon taraudé · DFA : goujon entre deux brides</p></div>`,
 i:()=>{const u=()=>filt(FL,'#q','#tb');$('#q').oninput=u;u()}},
br:{n:'Joints BX/RX',h:()=>`<div class="card"><p style="margin:0">Numéro de joint selon le diamètre et la pression (PSI)</p>${search('q','Rechercher…')}${tbl(['Size','2000','3000','5000','10000','15000','20000'],'','tb')}</div>`,
 i:()=>{const u=()=>filt(BR,'#q','#tb');$('#q').oninput=u;u()}},
sl:{n:'Coins DSC/DSP',h:()=>`<div class="card">${search('q','Rechercher (ex. 5 1/2 ou REDUCER)…')}${tbl(['Size','Type','Ref','Qty','Wt/set','AOT#'],'','tb')}<p class="note">Remarque : la répétition de la référence 2168 / 23-163 pour DSP 5" – tub 4" et DSP 5 1/2" – tub 4 1/2" figure dans le catalogue du fabricant (Keystone) ; ce n’est pas une erreur de votre fichier.</p></div>`,
 i:()=>{const u=()=>filt(SL,'#q','#tb');$('#q').oninput=u;u()}}
};
const I={torque:'🔧',vol:'🧪',wt:'⚖️',cv:'🔁',fl:'⭕',br:'🔘',sl:'🛠️'};const nav=$('#nav');
nav.innerHTML=Object.keys(T).map(k=>`<button data-k="${k}">${I[k]} ${T[k].n}</button>`).join('');
function show(k){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('#m').innerHTML=T[k].h();T[k].i();location.hash=k}
nav.onclick=e=>{if(e.target.dataset.k)show(e.target.dataset.k)};
show(T[location.hash.slice(1)]?location.hash.slice(1):'torque');
</script>
</body>
</html>
