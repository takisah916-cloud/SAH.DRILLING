name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generate Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/sah/drilling app/src/main/res/drawable app/src/main/res/values
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SAH.DRILLING"
          include ':app'
          EOT
          cat > build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOT
          printf 'android.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx2g\n' > gradle.properties
          cat > app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.sah.drilling'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.sah.drilling'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOT
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="SAH.DRILLING" android:icon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme" android:allowBackup="true">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT
          cat > app/src/main/java/com/sah/drilling/MainActivity.java <<'EOT'
          package com.sah.drilling;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView web;
              private class Bridge {
                  @JavascriptInterface
                  public void quit() { runOnUiThread(() -> web.postDelayed(() -> finishAffinity(), 400)); }
              }
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.parseColor("#0b2239"));
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl("file:///android_asset/index.html");
              }
              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOT
          cat > app/src/main/res/values/styles.xml <<'EOT'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar"/>
          </resources>
          EOT
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOT'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0B2239" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="4" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M54,22 L38,82 M54,22 L70,82 M54,22 L54,82 M42,58 L66,58 M39,72 L69,72"/>
              <path android:strokeColor="#F26A1B" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M26,88 L82,88"/>
          </vector>
          EOT
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SAH-DRILLING-apk
          path: app/build/outputs/apk/debug/app-debug.apk
